 shopAddOne:e=>{addShop(e.dataset.v,'');save();render()},
 shopFromMeals:()=>{let n=0;weekIngredients(monday(today())).forEach(x=>{if(addShop(x,'meals'))n++});save();render();toast(n?`Added ${n} ingredient${n===1?'':'s'}`:'Already on your list')},
 shopFromMealsW:e=>{let n=0;weekIngredients(e.dataset.w).forEach(x=>{if(addShop(x,'meals'))n++});save();render();toast(n?`Added ${n} to your shopping list`:'Already on your list')},
 shopUsuals:()=>{let n=0;usuals().forEach(x=>{if(addShop(x,'usual'))n++});save();render();toast(n?`Added ${n} usual${n===1?'':'s'}`:'Already on your list')},
 shopUsual:e=>{const x=shopList().find(i=>i.id===e.dataset.id);if(!x)return;const u=usuals(),k=u.findIndex(n=>n.toLowerCase()===x.name.toLowerCase());if(k>=0)u.splice(k,1);else u.push(x.name);save();render()},
 usualDel:e=>{usuals().splice(+e.dataset.i,1);save();render()},
 shopCopy:async()=>{const t=shopText();if(!t){toast('Nothing to copy');return}try{await navigator.clipboard.writeText(t);toast('List copied: paste it into a message')}catch(x){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('List copied')}catch(y){toast('Could not copy')}ta.remove()}},
 calConnect:()=>{db.settings.gcal=true;G.rev++;persist().then(()=>signIn(false,true,true))},
 calOff:()=>{db.settings.gcal=false;C.calId=null;C.ext={};save();render();toast('Calendar disconnected. The Sadhana calendar stays in Google Calendar until you delete it there.')},
 calNow:()=>{C.extAt={};C.list=null;runCal();toast('Syncing calendar')},
 calWhat:e=>{db.settings.gcalWhat={...calWhat(),[e.dataset.k]:e.checked};save();calSoon()},
 calShow:e=>{const s=new Set(showCals());if(e.checked)s.add(e.dataset.id);else s.delete(e.dataset.id);db.settings.gcalShow=[...s];C.ext={};C.extAt={};save();render()},
 clearFile:e=>{MODAL.clear[e.dataset.k]=1;e.parentElement.textContent='Will be removed when you save'},
 toggleTodo:e=>{const t=byId('todos',e.dataset.id);t.done=!t.done;t.doneOn=t.done?today():'';save();render()},
 toggle:e=>{const x=byId(e.dataset.col,e.dataset.id);x[e.dataset.k]=!x[e.dataset.k];save();render()},
 habit:e=>{const d=e.dataset.d,h=e.dataset.h;const l=db.habitLog[d]||(db.habitLog[d]=[]);const i=l.indexOf(h);if(i>=0)l.splice(i,1);else l.push(h);save();render()},
 water:e=>{const x=D(S.date);const n=+e.dataset.n;x.water=(x.water===n)?n-1:n;save();render()},
 mood:e=>{const x=D(e.dataset.d);const n=+e.dataset.n;x.mood=x.mood===n?0:n;save();render()},
 cycleMood:e=>{const x=db.days[e.dataset.d]||(db.days[e.dataset.d]={});x.mood=((x.mood||0)+1)%6;save();render()},
 navDay:e=>{const n=+e.dataset.n;S.date=n?addDays(S.date,n):today();render()},
 navWeek:e=>{const n=+e.dataset.n;S.week=n?addDays(S.week,7*n):monday(today());render()},
 navMonth:e=>{const n=+e.dataset.n;S.month=n?addMonths(S.month,n):ymOf(today());render()},
 navYear:e=>{const n=+e.dataset.n;S.year=n?String(+S.year+n):today().slice(0,4);render()},
 navHM:e=>{const n=+e.dataset.n;S.hMonth=n?addMonths(S.hMonth,n):ymOf(today());render()},
 navMY:e=>{const n=+e.dataset.n;S.moodYear=n?String(+S.moodYear+n):today().slice(0,4);render()},
 navTx:e=>{const n=+e.dataset.n;S.f.txMonth=n?addMonths(S.f.txMonth,n):ymOf(today());render()},
 navCal:e=>{const n=+e.dataset.n;S.calMonth=n?addMonths(S.calMonth,n):ymOf(today());render()},
 calDay:(e,ev)=>{if(ev.target.closest('.ev'))return;openForm('events',null,{date:e.dataset.v})},
 rmGoal:e=>{const arr=getPath(e.dataset.p);arr.splice(+e.dataset.i,1);save();render()},
 filt:e=>{S.f[e.dataset.k]=e.dataset.v;render()},
 openProject:e=>{S.view='projects';S.f.proj=e.dataset.id;render();window.scrollTo(0,0)},
 closeProject:()=>{S.f.proj=null;render()},
 pack:e=>{const tr=byId('trips',e.dataset.id);tr.packed=tr.packed||[];const v=e.dataset.v,i=tr.packed.indexOf(v);if(i>=0)tr.packed.splice(i,1);else tr.packed.push(v);save();render()},
 signIn:()=>signIn(false),
 backupNow:async()=>{toast('Backing up');try{await makeBackup();toast('Backup saved to your Drive');render()}catch(e){toast('Backup failed: check you are online')}},
 showBackups:async()=>{try{BK.list=(await listBackups()).slice(0,BK.keep);render()}catch(e){toast('Could not load backups')}},
 restoreBk:async e=>{if(!e.dataset.sure){e.dataset.sure=1;e.textContent='Tap again to replace everything with this backup';return}try{await restoreBackup(e.dataset.id);toast('Backup restored')}catch(x){toast('That backup could not be restored')}},
 syncNow:()=>{sync();toast('Syncing')},
 signOut:async()=>{signOut();await persist();render();toast('Signed out on this device')},
 syncTap:()=>{if(G.problem==='scope')signIn(false,true);else if(G.problem==='api_off'){S.view='settings';render()}else if(configured()&&!tokenOk())signIn(false);else sync()},
 allowDrive:()=>signIn(false,true),
 viewFile:async e=>{const u=await fileURL(e.dataset.f);const r=await fileRec(e.dataset.f);if(!u){toast('File not found');return}
  const isImg=(r.type||'').startsWith('image/'),isPdf=(r.type||'')==='application/pdf';
  const box=document.createElement('div');box.className='scrim';box.style.zIndex=70;box.innerHTML=`<div class="modal" style="width:min(900px,100%)"><header class="cardhead"><h3 style="overflow-wrap:anywhere">${esc(r.name)}</h3><button class="iconbtn" aria-label="Close">${ic('x')}</button></header><div style="padding:12px 24px 22px">${isImg?`<img src="${u}" alt="${esc(r.name)}" style="border-radius:10px">`:isPdf?`<iframe src="${u}" title="${esc(r.name)}" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px"></iframe>`:''}<p style="margin-top:10px"><a href="${u}" target="_blank" rel="noopener" download="${esc(r.name)}" class="btn sm">Open or save the file</a></p></div></div>`;
  box.addEventListener('click',ev=>{if(ev.target===box||ev.target.closest('.iconbtn'))box.remove()});document.body.appendChild(box)},
 clearEx:()=>{for(const k in db){if(Array.isArray(db[k]))db[k]=db[k].filter(x=>!x.ex)}
  const hs=new Set(db.habits.map(h=>h.id));for(const d in db.habitLog)db.habitLog[d]=db.habitLog[d].filter(h=>hs.has(h));
  for(const d in db.days)if(db.days[d].ex)delete db.days[d];
  for(const m in db.months){const x=db.months[m];x.goals=(x.goals||[]).filter(g=>!g.ex);if(x.focusEx){delete x.focus;delete x.focusEx}}
  for(const y in db.years){const x=db.years[y];x.goals=(x.goals||[]).filter(g=>!g.ex);if(x.wordEx){delete x.word;delete x.wordEx}}
  for(const w in db.fitPlan)for(const i in db.fitPlan[w])for(const k in db.fitPlan[w][i]){const v=db.fitPlan[w][i][k];if(v&&!byId('workouts',v)&&!byId('meals',v))delete db.fitPlan[w][i][k]}
  db.examples=false;save();render();toast('Examples removed')},
 export:async()=>{const files={};for(const id of fileIds()){const r=await fileRec(id);if(r)files[id]={name:r.name,type:r.type,data:await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(r.blob)})}}
  const blob=new Blob([JSON.stringify({app:'sadhana',at:new Date().toISOString(),db,files})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sadhana-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')},
 import:()=>document.getElementById('importfile').click(),
 wipe:e=>{if(e.dataset.sure){db=seed();db.examples=false;for(const k in db){if(Array.isArray(db[k]))db[k]=db[k].filter(x=>!x.ex)}db.habitLog={};db.days={};db.months={};db.years={};db.fitPlan={};save();render();toast('Erased')}else{e.dataset.sure=1;e.textContent='Tap again to erase everything'}}
};
const ADD={
 shop:v=>{const n=addShop(v,'');if(!n)toast('Already on your list')},
 matter:v=>db.matters.push({id:'m_'+uid(),name:v}),
 dayTodo:(v)=>db.todos.push({id:uid(),title:v,priority:'Normal',planned:S.date}),
 projTodo:(v,el)=>db.todos.push({id:uid(),title:v,priority:'Normal',project:el.dataset.id}),
 monthGoal:v=>M(S.month).goals.push({id:uid(),t:v,done:false}),
 yearGoal:(v,el)=>Y(S.year).goals.push({id:uid(),area:el.dataset.area,t:v,done:false})
};

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;
 if(el.classList.contains('scrim')&&ev.target!==el)return;
 if(el.tagName==='INPUT'&&el.type==='checkbox'){fn(el,ev);return}
 ev.preventDefault();fn(el,ev)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&MODAL)closeModal();
 const t=ev.target;if(ev.key==='Enter'&&t.dataset&&t.dataset.add&&t.value.trim()){ADD[t.dataset.add](t.value.trim(),t);t.value='';save();render();}
 if((ev.key==='Enter'||ev.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset.act){ev.preventDefault();A[t.dataset.act](t,ev)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.bind&&t.type!=='checkbox'&&t.tagName!=='SELECT'){setPath(t.dataset.bind,t.dataset.num?Number(t.value):t.value);save()}
 if(t.dataset.filter){S.f[t.dataset.filter]=t.value;render()}});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.dataset.bind)return;if(t.type==='checkbox'){setPath(t.dataset.bind,t.checked);save();render()}else if(t.tagName==='SELECT'){setPath(t.dataset.bind,t.value);save();if(t.dataset.bind==='settings.theme')applyTheme();render()}
 else if(t.dataset.bind.startsWith('settings.'))render()});
document.addEventListener('submit',ev=>{if(ev.target.id==='mform'){ev.preventDefault();submitForm()}});
document.getElementById('importfile').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.db)throw 0;for(const [k,r] of Object.entries(j.files||{})){const b=await (await fetch(r.data)).blob();await local.put('files',k,{name:r.name,type:r.type,blob:b});if(!G.pendingFiles.includes(k))G.pendingFiles.push(k)}db=j.db;delete db.driveFiles;ensure();save();applyTheme();render();toast('Backup restored')}catch(e){toast('That file is not a planner backup')}ev.target.value=''});

/* ---------- boot ---------- */
(async()=>{await boot();applyTheme();render();setInterval(tickClock,10000);sync();
 let last=today();setInterval(()=>{if(today()!==last){last=today();S.date=last;render()}},60000);
 if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}})();
</script>
</body>
