<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Sadhana">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2ECE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sadhana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Figtree:wght@400;500;600&family=Caveat:wght@400;500&display=swap">
<style>
/* Layout: a quiet linen sidebar beside a paper-card planner canvas; serif for voice, handwriting only on the paper day page */
:root{
  --bg:#F2ECE2; --paper:#FBF8F2; --sand:#E9E0D1; --line:#E1D6C5; --ink:#33291F; --muted:#86735F;
  --sage:#6E7E5C; --sage-soft:#DEE5D3; --sage-deep:#4B5840; --clay:#A07A57; --clay-soft:#F1E6D6;
  --rust:#A8614A; --rust-soft:#F4DFD5; --tile:#EFE8DC; --tile-ink:#221A13; --hover:#F5F0E7;
  --shadow:0 1px 2px rgba(70,52,34,.05),0 8px 24px rgba(70,52,34,.06);
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --sans:"Figtree",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --m1:#B77A62; --m2:#C9A27C; --m3:#DCCFB9; --m4:#A9B893; --m5:#6E7E5C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1915; --paper:#26211C; --sand:#322A23; --line:#3D342B; --ink:#EEE5D8; --muted:#A8977F;
  --sage:#A2B28C; --sage-soft:#343D2C; --sage-deep:#C3D0AE; --clay:#CFA980; --clay-soft:#3A2F24;
  --rust:#D98E74; --rust-soft:#43291F; --tile:#3A3129; --tile-ink:#F3EADC; --hover:#2D2721;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);
  --m1:#B06F58; --m2:#B8916B; --m3:#6B6052; --m4:#7F9068; --m5:#A2B28C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1915; --paper:#26211C; --sand:#322A23; --line:#3D342B; --ink:#EEE5D8; --muted:#A8977F;
  --sage:#A2B28C; --sage-soft:#343D2C; --sage-deep:#C3D0AE; --clay:#CFA980; --clay-soft:#3A2F24;
  --rust:#D98E74; --rust-soft:#43291F; --tile:#3A3129; --tile-ink:#F3EADC; --hover:#2D2721;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);
  --m1:#B06F58; --m2:#B8916B; --m3:#6B6052; --m4:#7F9068; --m5:#A2B28C; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.15}
h2{font-size:1.55rem;line-height:1.2}
h3{font-size:1.2rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.45rem;letter-spacing:-.01em}
.brand span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;color:var(--muted);font-size:.93rem}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:0 10px}
.main{padding-block:32px 64px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.wrap{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:6px;max-width:62ch}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h2+p,.card h3+p{color:var(--muted);margin-top:6px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rule{height:1px;background:var(--line);margin:16px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.split{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}.split2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.split3{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.84rem}

.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;font-size:.9rem;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper)}
.btn.primary:hover{opacity:.92}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--rust)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.iconbtn{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-family:var(--serif);font-size:1.05rem;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--sand);color:var(--ink)}
.tabs svg{width:17px;height:17px}

.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font-size:.8rem;font-weight:500;white-space:nowrap;background:var(--sand);color:var(--ink)}
.pill.green{background:var(--sage-soft);color:var(--sage-deep)}
.pill.clay{background:var(--clay-soft);color:var(--clay)}
.pill.rust{background:var(--rust-soft);color:var(--rust)}
.pill.plain{background:none;border:1px solid var(--line);color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--paper);padding:4px 11px;border-radius:999px;font-size:.84rem;color:var(--muted)}
.chip.on{background:var(--sage-deep);color:var(--paper);border-color:var(--sage-deep)}

/* overview cards */
.ov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ovc{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(70,52,34,.04)}
.ovc:hover{background:var(--hover)}
.ovc .t{font-family:var(--serif);font-size:1.3rem}
.ovc .w{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:.95rem}
.ovc .w svg{width:15px;height:15px;color:var(--rust)}

/* flip clock */
.clock{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:8px 0 4px}
.flip{position:relative;background:var(--tile);color:var(--tile-ink);border-radius:12px;font-family:var(--serif);font-weight:500;font-size:clamp(3rem,6vw,4.4rem);line-height:1;padding:16px 14px 18px;min-width:1.7em;text-align:center;box-shadow:0 10px 24px rgba(60,44,28,.16),inset 0 -2px 0 rgba(0,0,0,.04);font-variant-numeric:tabular-nums}
.flip::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--bg);opacity:.9}
.flip.ampm{font-size:1.4rem;min-width:0;padding:9px 10px}
.colon{font-family:var(--serif);font-size:2.6rem;padding-bottom:22px;color:var(--tile-ink)}

.notif{display:flex;flex-direction:column;gap:9px;font-family:var(--serif);font-size:1.05rem}
.notif .sec{color:var(--muted);font-size:.95rem;display:flex;align-items:center;gap:8px;margin-top:6px}
.notif .sec::before,.notif .sec::after{content:"";height:1px;width:14px;background:var(--line)}
.notif .it{display:flex;gap:10px;align-items:baseline}
.notif .it i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--clay);flex:none;transform:translateY(-1px)}
.notif .it i.g{background:var(--sage)}
.notif .it i.r{background:var(--rust)}

/* to-do rows */
.group{display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 0 6px;text-align:left}
.ghead .caret{width:14px;height:14px;transition:transform .15s;color:var(--muted)}
.ghead.shut .caret{transform:rotate(-90deg)}
.ghead .count{color:var(--muted);font-size:.85rem}
.todo{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);min-width:0}
.todo:hover{background:var(--hover)}
.todo .tt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;font-family:var(--serif);font-size:1.05rem;overflow-wrap:anywhere}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.check{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.5px solid var(--clay);border-radius:5px;display:inline-grid;place-items:center;flex:none;margin:0;background:var(--paper);cursor:pointer}
.check:checked{background:var(--sage-deep);border-color:var(--sage-deep)}
.check:checked::after{content:"";width:9px;height:5px;border:2px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:.92rem}

.addline{display:flex;gap:8px;margin-top:10px}
.addline input{flex:1;min-width:0}
.field,.addline input,.field-in{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 11px;width:100%}
textarea.field{min-height:90px;resize:vertical;line-height:1.55}

/* schedule */
.sched{display:flex;flex-direction:column}
.sched .s{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--serif)}
.sched .s span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}

/* habits chips */
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px 6px 8px;font-size:.9rem}
.hchip .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--sage)}
.hchip.on{background:var(--sage-soft);border-color:var(--sage-soft);color:var(--sage-deep)}
.hchip.on .dot{background:var(--sage-deep);border-color:var(--sage-deep)}

/* paper day page */
.spread{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pg{padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.pg+.pg{border-left:1px solid var(--line);background:linear-gradient(90deg,rgba(70,52,34,.05),transparent 22px)}
.band{background:var(--sand);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;font-weight:600;padding:5px 10px;border-radius:5px;display:inline-block}
.lines{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:52px 1fr;align-items:end;border-bottom:1px solid var(--line);min-height:34px;gap:8px}
.hcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;cursor:pointer;padding:16px 18px}
.hcard.muted{opacity:.6}
.hwhen{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:12px}
.hwhen .d{font-family:var(--serif);font-size:1.15rem}
.hwhen .t{font-size:.8rem;color:var(--muted)}
.htitle{font-family:var(--serif);font-weight:500;font-size:1.08rem}
@media (max-width:600px){.hcard{grid-template-columns:minmax(0,1fr);gap:8px}.hwhen{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;flex-direction:row;gap:10px;align-items:baseline}}
.cal .ev.hr{background:var(--rust-soft);color:var(--rust);font-weight:500}
.ln.half{min-height:30px;border-bottom-style:dashed}
.ln.half .h{opacity:.7}
.ln:has(select.dur){grid-template-columns:52px 1fr auto auto}
select.dcat{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--muted);font:500 .72rem var(--sans);padding:0 2px 8px;cursor:pointer;max-width:84px;text-overflow:ellipsis}
select.dcat:hover,select.dcat:focus{color:var(--ink)}
.catdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.catchip{display:inline-flex;align-items:center}
select.dur{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--muted);font:500 .72rem var(--sans);padding:0 2px 8px;cursor:pointer;text-align:right}
select.dur:hover,select.dur:focus{color:var(--ink)}
.ln:has(input.hand:placeholder-shown) select.dur,.ln:has(input.hand:placeholder-shown) select.dcat{visibility:hidden}
.ln:has(input.hand:focus) select.dur,.ln:has(input.hand:focus) select.dcat{visibility:visible}
.ln input.hand::placeholder{color:var(--muted);opacity:.55}
.ln.nohour{grid-template-columns:24px 1fr}
.evx{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px;padding:0 0 7px}
.ev{font:500 .78rem var(--sans);background:var(--sand);color:var(--ink);border-radius:5px;padding:2px 8px}
.ev.cont{background:transparent;color:var(--muted);padding:2px 0}
.ln .h{font-size:.72rem;color:var(--muted);padding-bottom:7px;font-variant-numeric:tabular-nums}
.hand{border:0;background:transparent;font-family:var(--hand);font-size:1.35rem;line-height:1.3;padding:2px 0;width:100%;min-width:0;color:var(--ink)}
.hand::placeholder{color:var(--line)}
.hand:focus{outline:none;background:var(--hover)}
textarea.hand{resize:vertical;background-image:repeating-linear-gradient(transparent,transparent 33px,var(--line) 33px,var(--line) 34px);line-height:34px;min-height:170px;padding:0}
.box3{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.trackers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tk .band{align-self:flex-start}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glasses button{border:0;background:none;padding:0;color:var(--line)}
.glasses button.on{color:var(--sage)}
.glasses svg{width:20px;height:24px}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.faces button{border:0;background:none;padding:2px;border-radius:50%;color:var(--muted);opacity:.55}
.faces button.on{opacity:1}
.faces svg{width:30px;height:30px}

/* tables */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.t{font-family:var(--serif);font-size:1rem}

/* stat tiles */
.stat{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--serif);font-size:1.75rem;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .s{font-size:.84rem;color:var(--muted)}
.stat.warn{border-color:var(--rust-soft);background:linear-gradient(var(--rust-soft),var(--rust-soft)) top/100% 3px no-repeat,var(--paper)}

/* bars */
.bar{height:8px;border-radius:99px;background:var(--sand);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar i.over{background:var(--rust)}
.brow{display:grid;grid-template-columns:120px 1fr 130px;gap:12px;align-items:center;font-size:.9rem}
.brow .r{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* item cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ic{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.ic:hover{background:var(--hover)}
.ic .t{font-family:var(--serif);font-size:1.15rem;line-height:1.25;overflow-wrap:anywhere}
.ic .x{color:var(--muted);font-size:.88rem;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ic img{border-radius:10px;aspect-ratio:4/5;object-fit:cover;width:100%;background:var(--sand)}
.ph{border-radius:10px;aspect-ratio:4/5;background:var(--sand);display:grid;place-items:center;color:var(--muted);font-size:.8rem}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sand);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col>.cardhead{padding:2px 4px}

/* habit grid */
.hg td,.hg th{padding:0;border:0;background:none}
.hg{border-collapse:separate;border-spacing:3px;width:auto}
.hg th{font-size:.68rem;text-align:center;letter-spacing:0;padding:2px 0;color:var(--muted);text-transform:none}
.hg th.today{color:var(--ink);font-weight:700}
.hg td.n{padding:0 12px 0 0;white-space:nowrap;font-family:var(--serif);font-size:.98rem}
.hg td.s{padding-left:10px;white-space:nowrap;color:var(--muted);font-size:.82rem}
.hc{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--paper);padding:0;display:block}
.hc.on{background:var(--sage);border-color:var(--sage)}
.hc.fut{opacity:.4}
tbody tr.nohover{cursor:default}
tbody tr.nohover:hover td{background:none}

/* mood pixels */
.px{display:grid;grid-template-columns:40px repeat(31,minmax(12px,1fr));gap:3px;min-width:560px}
.px span{font-size:.68rem;color:var(--muted);text-align:center}
.px span.m{text-align:left}
.px button{aspect-ratio:1;border:0;border-radius:3px;background:var(--sand);padding:0}
.px button.na{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* vision */
.vb{columns:4 220px;column-gap:14px}
.vb>*{break-inside:avoid;margin-bottom:14px;display:block;width:100%}
.vq{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:22px;text-align:left;font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.35}
.vq small{display:block;font-style:normal;font-family:var(--sans);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.vi{border:0;padding:0;background:none;text-align:left;position:relative}
.vi img{border-radius:14px;width:100%;display:block}
.vi small{position:absolute;left:10px;bottom:10px;background:var(--paper);padding:3px 9px;border-radius:6px;font-size:.78rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--bg);padding:8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cal .dc{background:var(--paper);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;min-width:0}
.cal .dc.out{background:var(--bg);color:var(--muted)}
.cal .dc .d{font-size:.82rem;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .dc.today .d{background:var(--sage-deep);color:var(--paper)}
.ev{font-size:.76rem;padding:2px 6px;border-radius:5px;background:var(--sage-soft);color:var(--sage-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%}
.ev.b{background:var(--clay-soft);color:var(--clay)}
.ev.t{background:var(--sand);color:var(--ink)}
.ev.dt{background:var(--rust-soft);color:var(--rust)}

/* sabha */
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.76rem;padding:1px 8px;border-radius:99px;background:var(--sage-soft);color:var(--sage-deep)}
.ash{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:26px 28px;text-align:left;display:flex;flex-direction:column;gap:12px}
.ash blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:1.35rem;line-height:1.4;white-space:pre-line;border-left:2px solid var(--clay);padding-left:16px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,30,20,.35);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.modal{background:var(--paper);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(30,20,10,.3);display:flex;flex-direction:column}
.modal header{padding:22px 24px 6px}
.modal .body{padding:12px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.modal .body .full{grid-column:1/-1}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);min-width:0}
.modal label.cb{flex-direction:row;align-items:center;gap:9px;color:var(--ink);font-size:.9rem}
.modal footer{padding:14px 24px 22px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal footer .del{margin-right:auto}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:.88rem;z-index:60;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.exnote{font-size:.84rem;color:var(--clay);background:var(--clay-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:14px}
  .brand span,.side .foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .grid2,.spread,.ov,.split,.split2,.split3{grid-template-columns:minmax(0,1fr)}
  .pg+.pg{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:600px){
  .grid3,.grid4,.trackers,.modal .body{grid-template-columns:minmax(0,1fr)}
  .brow{grid-template-columns:90px 1fr;}
  .brow .r{grid-column:1/-1;text-align:left}
  .cal .dc{min-height:64px}
  .cal .ev{font-size:0;height:6px;padding:0}
  h1{font-size:1.7rem}
}
.syncpill{display:none}
.shoprow{display:grid;grid-template-columns:24px minmax(0,1fr) 70px 150px 30px 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.shoprow:last-child{border-bottom:0}
.shoprow input.shopname,.shoprow input.shopqty{border:0;background:transparent;font:inherit;color:var(--ink);padding:4px 2px;min-width:0}
.shoprow input.shopname{font-size:1rem}
.shoprow input.shopqty{color:var(--muted);font-size:.85rem}
.shoprow select.shopaisle{border:0;background:transparent;color:var(--muted);font:.78rem var(--sans);min-width:0}
.shoprow.done input.shopname{text-decoration:line-through;color:var(--muted)}
.shoprow .star{color:var(--line);font-size:1rem}.shoprow .star.on{color:#D08C3C}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.icw{display:flex;flex-direction:column;gap:6px;min-width:0}.icw>.ic{flex:1}.mealshop{align-self:flex-start;gap:6px}.mealshop svg,#mform [data-act=shopForm] svg{width:15px;height:15px;flex:none}
.chip.usual{display:inline-flex;align-items:center;gap:2px;padding-right:4px}
.chip.usual button{all:unset;cursor:pointer}.chip.usual .ux{opacity:.5;padding:0 4px}
@media (max-width:600px){.shoprow{grid-template-columns:24px minmax(0,1fr) 56px 28px 28px}.shoprow select.shopaisle{display:none}}
.hindu{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:2px 0 4px;color:var(--muted)}
.hindu .hd{font-weight:500;color:var(--clay)}
.hrow{padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.cal .tithi{display:block;font-size:.62rem;color:var(--muted);line-height:1.2;margin:-2px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.hf{background:color-mix(in srgb, #D08C3C 16%, transparent);color:inherit;cursor:default}
.cal .ev.hf.ek{background:color-mix(in srgb, #8C7BB0 18%, transparent)}
@media (max-width:600px){.cal .tithi{display:none}}
.quickadd{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--sage);border-radius:12px;background:var(--sage-soft);min-width:0;flex:none}
.row>.quickadd{flex:1 1 220px}
.timer{padding:16px 20px;margin-bottom:18px}
.timer.running{border-color:var(--sage);box-shadow:0 0 0 1px var(--sage),var(--shadow)}
.timer.paused,.timer.stopped{border-color:var(--clay)}
.tmicon{font-size:1.2rem}
.tmclock{font-family:var(--serif);font-size:1.9rem;line-height:1;letter-spacing:.01em}
.tmpill{position:fixed;right:22px;bottom:22px;z-index:41;font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:#fff;background:var(--sage-deep);border:0;border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer}
.tmpill.paused,.tmpill.stopped{background:var(--clay)}
@media (max-width:900px){.tmpill{right:auto;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom))}}
.card label.cb{display:flex;align-items:center;gap:10px}
.cal .ev.x{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default}
.signin{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--sage-soft);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:18px}
.signin p{margin:0;color:var(--ink)}
.gbtn{display:inline-flex;align-items:center;gap:8px}
.gbtn svg{width:16px;height:16px}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (max-width:900px){.syncpill{display:block;position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;font:500 12px var(--sans);color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);cursor:pointer}
 .main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    <div class="brand"><b>Sadhana</b><span>Life planner</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="foot" id="savestate" data-act="syncTap" style="all:unset;cursor:pointer;font-size:.78rem;color:var(--muted);padding:0 10px">Opening…</button>

<script>
/* ---------- utilities ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const ymOf=s=>s.slice(0,7);
const addMonths=(ym,n)=>{const d=parse(ym+'-01');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
const daysIn=ym=>{const d=parse(ym+'-01');return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const fLong=s=>{const d=parse(s);return `${DOW[(d.getDay()+6)%7]} ${ord(d.getDate())} ${MON[d.getMonth()].slice(0,3)}`};
const fShort=s=>{if(!s)return '';const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`};
const fFull=s=>{if(!s)return '';const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${d.getFullYear()}`};
const fMonth=ym=>{const d=parse(ym+'-01');return `${MON[d.getMonth()]} ${d.getFullYear()}`};
const cur=()=>db.settings.currency||'£';
const money=n=>cur()+(Number(n)||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>cur()+Math.round(Number(n)||0).toLocaleString('en-GB');
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);
const taxYearStart=()=>{const t=new Date();const y=(t.getMonth()>3||(t.getMonth()===3&&t.getDate()>=6))?t.getFullYear():t.getFullYear()-1;return `${y}-04-06`};

/* ---------- storage: her own Google Drive (hidden app folder), with a full copy on this device ----------
   - Everything is saved on this device first (IndexedDB), so the app opens instantly and works offline.
   - It then syncs to one file, sadhana.json, in the Drive "app data" folder: hidden, and only this app can see it.
   - Photos and uploaded files are stored as separate files in the same hidden folder.
   - If both devices changed things, the changes are merged item by item (by id), newest edit to the same item wins. */
const CFG=window.SADHANA_CONFIG||{};
const local={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('sadhana-drive',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(s,k){return new Promise(res=>{if(!this.db)return res(undefined);try{const q=this.db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 put(s,k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction(s,'readwrite');tx.objectStore(s).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})},
 del(s,k){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})},
 clear(){return Promise.all(['kv','files'].map(s=>new Promise(res=>{if(!this.db)return res();try{const tx=this.db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})))}
};

const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const G={token:null,exp:0,fileId:null,version:null,base:null,rev:0,syncedRev:0,syncing:false,again:false,pendingFiles:[],status:'',remoteWaiting:null};
const SCOPE='https://www.googleapis.com/auth/drive.appdata';
const CAL_SCOPES=['https://www.googleapis.com/auth/calendar.app.created','https://www.googleapis.com/auth/calendar.calendarlist.readonly','https://www.googleapis.com/auth/calendar.events.readonly'];
const wantCal=()=>!!(db&&db.settings&&db.settings.gcal);
const DRIVE='https://www.googleapis.com/drive/v3',UPLOAD='https://www.googleapis.com/upload/drive/v3',DATA='sadhana.json';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const appUrl=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const dirty=()=>G.rev!==G.syncedRev;
const tokenOk=()=>!!G.token&&Date.now()<G.exp;
const configured=()=>!!(CFG.googleClientId&&!/PASTE/.test(CFG.googleClientId));
/* Staying signed in. Browser-only apps get one-hour passes from Google. If config.js names a token helper
   (a tiny Cloudflare Worker you own, which only swaps codes for passes and stores nothing), the app gets a
   long-lasting "refresh" pass instead and quietly renews itself, so she never has to sign in again. */
const HELPER=()=>(CFG.tokenHelper||'').replace(/\/+$/,'');
const hasRT=()=>!!(HELPER()&&ls.get('sadhana.rt'));
async function helper(path,body){const r=await fetch(HELPER()+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return {ok:r.ok,j}}
function setToken(t,exp,scopes){G.problem=null;G.token=t;G.exp=Date.now()+((+exp||3600)-120)*1000;if(scopes)G.scopes=scopes;ls.set('sadhana.token',JSON.stringify({t:G.token,e:G.exp,s:G.scopes}));ls.set('sadhana.signedIn','1')}
let renewing=null;
function renew(){if(!hasRT())return Promise.resolve(false);if(renewing)return renewing;
 renewing=(async()=>{try{const {ok,j}=await helper('/refresh',{refresh_token:ls.get('sadhana.rt')});
   if(ok&&j.access_token){setToken(j.access_token,j.expires_in,j.scope);return true}
   if(j.error==='invalid_grant'){ls.del('sadhana.rt');setStatus('Tap to reconnect')}return false}
  catch(e){return false}finally{setTimeout(()=>renewing=null,0)}})();return renewing}
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function takeCode(){const q=new URLSearchParams(location.search);if(!q.get('code')&&!q.get('error'))return null;
 history.replaceState(null,'',appUrl());
 if(q.get('state')!==ss.get('sadhana.state'))return 'bad_state';
 if(q.get('error'))return q.get('error');
 try{const {ok,j}=await helper('/exchange',{code:q.get('code'),redirect_uri:appUrl(),code_verifier:ss.get('sadhana.pkce')||undefined});
  if(!ok||!j.access_token)return j.error||'exchange_failed';
  if(j.scope&&!j.scope.split(' ').includes(SCOPE)){G.problem='scope';return 'scope'}
  setToken(j.access_token,j.expires_in,j.scope||'');if(j.refresh_token)ls.set('sadhana.rt',j.refresh_token);return 'ok'}
 catch(e){return 'offline'}}

/* sign-in: a plain redirect to Google and back, which works inside an iPhone home-screen app */
function signIn(silent,consent,withCal){
 if(!configured()){toast('Add your Google client ID to config.js first');return}
 const state=uid()+uid();ss.set('sadhana.state',state);if(silent)ss.set('sadhana.silentAt',String(Date.now()));
 const code=!!HELPER()&&!silent;
 persist().then(async()=>{const p=new URLSearchParams({client_id:CFG.googleClientId,redirect_uri:appUrl(),response_type:code?'code':'token',scope:[SCOPE,...((withCal||wantCal())?CAL_SCOPES:[])].join(' '),include_granted_scopes:'true',state});
  if(code){p.set('access_type','offline');consent=true;
   try{const v=b64u(crypto.getRandomValues(new Uint8Array(32)));ss.set('sadhana.pkce',v);p.set('code_challenge',b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));p.set('code_challenge_method','S256')}catch(e){ss.set('sadhana.pkce','')}}const hint=ls.get('sadhana.email');if(hint)p.set('login_hint',hint);const pr=silent?'none':consent?'consent':(hint?'':'select_account');if(pr)p.set('prompt',pr);
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p})}
function takeToken(){
 const h=new URLSearchParams(location.hash.slice(1));if(!h.get('access_token')&&!h.get('error'))return null;
 history.replaceState(null,'',appUrl());
 if(h.get('state')!==ss.get('sadhana.state'))return 'bad_state';
 if(h.get('error'))return h.get('error');
 if(h.get('scope')&&!h.get('scope').split(' ').includes(SCOPE)){G.problem='scope';return 'scope'}
 G.problem=null;G.scopes=h.get('scope')||'';G.token=h.get('access_token');G.exp=Date.now()+((+h.get('expires_in')||3600)-120)*1000;
 ls.set('sadhana.token',JSON.stringify({t:G.token,e:G.exp,s:G.scopes}));ls.set('sadhana.signedIn','1');return 'ok'}
function loadToken(){try{const j=JSON.parse(ls.get('sadhana.token')||'null');if(j&&j.e>Date.now()){G.token=j.t;G.exp=j.e;G.scopes=j.s||''}}catch(e){}}
function signOut(){const rt=ls.get('sadhana.rt');if(rt&&HELPER())helper('/revoke',{token:rt}).catch(()=>{});G.token=null;G.exp=0;['sadhana.token','sadhana.signedIn','sadhana.email','sadhana.rt'].forEach(k=>ls.del(k))}
/* remember which Google account she uses, so renewing access never needs the account picker */
function learnEmail(){if(ls.get('sadhana.email')||!tokenOk())return;api(DRIVE+'/about?fields=user(emailAddress)').then(r=>r.json()).then(j=>{if(j&&j.user&&j.user.emailAddress)ls.set('sadhana.email',j.user.emailAddress)}).catch(()=>{})}

async function api(url,opt={},again){
 if(!tokenOk()&&!(await renew()))throw {code:'auth'};
 let r;try{r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+G.token}})}catch(e){throw {code:'offline'}}
 if(r.status===401){G.token=null;ls.del('sadhana.token');if(!again&&await renew())return api(url,opt,true);throw {code:'auth'}}
 if(r.status===403||r.status===429){let reason='';try{const j=await r.json();const er=j.error||{};reason=[(er.errors||[]).map(x=>x.reason).join(' '),(er.details||[]).map(d=>d.reason||'').join(' '),er.status||'',er.message||''].join(' ')}catch(e){}
  console.warn('Google Drive refused the request:',r.status,reason);
  if(/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(reason))throw {code:'api_off'};
  if(/insufficient|SCOPE|PERMISSION_DENIED/i.test(reason))throw {code:'scope'};
  throw {code:'busy',status:r.status}}
 if(!r.ok)throw {code:'http',status:r.status};
 return r}
async function findFile(name){const q=encodeURIComponent(`name='${name}' and trashed=false`);const j=await (await api(`${DRIVE}/files?spaces=appDataFolder&q=${q}&fields=files(id,version)&pageSize=10`)).json();return (j.files||[])[0]||null}
const meta=async id=>(await api(`${DRIVE}/files/${id}?fields=id,version`)).json();
async function createFile(name,blob,mime){const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify({name,parents:['appDataFolder'],mimeType:mime})],{type:'application/json'}));fd.append('file',new Blob([blob],{type:mime}));return (await api(`${UPLOAD}/files?uploadType=multipart&fields=id,version`,{method:'POST',body:fd})).json()}
const updateFile=async(id,blob,mime)=>(await api(`${UPLOAD}/files/${id}?uploadType=media&fields=id,version`,{method:'PATCH',headers:{'Content-Type':mime},body:blob})).json();

/* merging two versions against the last synced one */
function mergeArr(b,l,r){
 const B=new Map((b||[]).map(x=>[x.id,x])),L=new Map((l||[]).map(x=>[x.id,x])),R=new Map((r||[]).map(x=>[x.id,x]));
 const out=[],seen=new Set();
 for(const x of [...(r||[]),...(l||[])]){const id=x.id;if(seen.has(id))continue;seen.add(id);
  const inB=B.has(id),inL=L.has(id),inR=R.has(id);
  if(inL&&inR){out.push(inB&&same(L.get(id),B.get(id))?R.get(id):L.get(id))}
  else if(inL&&!inR){if(!inB||!same(L.get(id),B.get(id)))out.push(L.get(id))}
  else if(inR&&!inL){if(!inB||!same(R.get(id),B.get(id)))out.push(R.get(id))}}
 return out}
const isIdList=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&'id' in x);
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function mergeVal(b,l,r,depth){
 if(same(l,b))return clone(r);if(same(r,b))return clone(l);
 if((isIdList(l)||l===undefined)&&(isIdList(r)||r===undefined)&&(b===undefined||isIdList(b)))return mergeArr(b,l,r);
 if(depth<2&&(isObj(l)||l===undefined)&&(isObj(r)||r===undefined)){const out={};const ks=new Set([...Object.keys(l||{}),...Object.keys(r||{})]);
  for(const k of ks){const v=mergeVal((b||{})[k],(l||{})[k],(r||{})[k],depth+1);if(v!==undefined)out[k]=v}return out}
 return clone(l)}
function merge(b,l,r){return mergeVal(b||{},l,r,0)}

/* local copy */
async function persist(){await local.put('kv','state',{db:clone(db),base:G.base,fileId:G.fileId,version:G.version,rev:G.rev,syncedRev:G.syncedRev,pendingFiles:G.pendingFiles})}
function setStatus(t){G.status=t;for(const id of ['savestate','syncpill']){const el=document.getElementById(id);if(el)el.textContent=t}const n=document.getElementById('syncnote');if(n)n.innerHTML=syncNote()}
function syncNote(){
 if(G.problem==='api_off')return '<b>Sync is blocked:</b> the Google Drive API is switched off for this app\'s Google Cloud project. In Google Cloud, select the project that holds this app\'s Client ID, search for <b>Google Drive API</b> and click <b>Enable</b>. Wait a few minutes, then tap <b>Sync now</b>.';
 if(G.problem==='scope')return '<b>Sync is blocked:</b> Google Drive access was not allowed when signing in. Tap <b>Allow Drive access</b> and make sure the Google Drive box is ticked on Google\'s screen.';
 if(!configured())return 'Sync is not set up yet: add your Google client ID to <b>config.js</b>. Until then, everything is saved on this device only.';
 if(tokenOk()||ls.get('sadhana.signedIn'))return 'Everything is saved on this device and synced to a hidden folder in your Google Drive, so the same planner opens on your Mac and iPhone. Only this app can see that folder.';
 return 'Not signed in, so changes are only saved on this device. Sign in with Google to sync between your Mac and iPhone.'}
function save(){G.rev++;persist();setStatus(tokenOk()?'Syncing…':'Saved on this device');clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;sync()},1200)}
function busy(){const a=document.activeElement;return MODAL||saveT||(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&a.type!=='checkbox')}
function refreshView(){if(busy()){G.remoteWaiting=true;return}G.remoteWaiting=false;applyTheme();render()}

async function sync(){
 if(!configured())return setStatus('Saved on this device');
 if(G.syncing){G.again=true;return}
 if(!tokenOk())await renew();
 if(!tokenOk()){
  if(!hasRT()&&ls.get('sadhana.signedIn')&&navigator.onLine!==false&&!busy()&&Date.now()-(+ss.get('sadhana.silentAt')||0)>300000){signIn(true);return}
  return setStatus(ls.get('sadhana.signedIn')?'Tap to reconnect':'Saved on this device')}
 G.syncing=true;setStatus('Syncing…');learnEmail();
 try{
  await uploadPending();
  let m=null;
  if(G.fileId){try{m=await meta(G.fileId)}catch(e){if(e.code==='http'&&e.status===404){G.fileId=null;G.version=null}else throw e}}
  if(!G.fileId){const f=await findFile(DATA);if(f){G.fileId=f.id;m=f}}
  if(m&&String(m.version)!==String(G.version)){
   const remote=await (await api(`${DRIVE}/files/${G.fileId}?alt=media`)).json();
   if(dirty()){db=merge(G.base,db,remote);ensure()}else{db=remote;ensure()}
   G.base=clone(remote);G.version=m.version;
   if(!dirty()&&!same(db,remote))G.rev++;
   refreshView()}
  if(dirty()||!G.fileId){
   const rev=G.rev,snap=JSON.stringify(db);
   const res=G.fileId?await updateFile(G.fileId,snap,'application/json'):await createFile(DATA,snap,'application/json');
   G.fileId=res.id;G.version=res.version;G.base=JSON.parse(snap);G.syncedRev=rev}
  await persist();setStatus(dirty()?'Syncing…':'Synced');calSoon();maybeBackup()
 }catch(e){
  G.problem=e.code==='api_off'||e.code==='scope'?e.code:null;
  setStatus(e.code==='offline'?'Offline: saved on this device':e.code==='auth'?'Tap to reconnect':e.code==='api_off'?'Drive API is off: see Settings':e.code==='scope'?'Tap to allow Drive access':e.code==='busy'?'Google is busy: will retry':'Not synced yet: will retry');
  if(e.code!=='auth'&&e.code!=='api_off'&&e.code!=='scope')setTimeout(()=>{if(dirty())sync()},20000)}

/* photos and files */
const URLS={};
async function putFile(f){const id='f_'+uid();await local.put('files',id,{name:f.name,type:f.type,blob:f});G.pendingFiles.push(id);persist();return {id,name:f.name,type:f.type}}
async function uploadPending(){
 db.driveFiles=db.driveFiles||{};
 while(G.pendingFiles.length){const id=G.pendingFiles[0];const r=await local.get('files',id);
  if(r){const res=await createFile(id,r.blob,r.type||'application/octet-stream');db.driveFiles[id]=res.id;G.rev++}
  G.pendingFiles.shift();await persist()}}
async function fileRec(id){let r=await local.get('files',id);
 if(!r&&db.driveFiles&&db.driveFiles[id]&&tokenOk()){try{const resp=await api(`${DRIVE}/files/${db.driveFiles[id]}?alt=media`);const blob=await resp.blob();const name=nameForFile(id);r={name,type:blob.type,blob};await local.put('files',id,r)}catch(e){}}
 return r||null}
function nameForFile(id){for(const k in db)if(Array.isArray(db[k]))for(const x of db[k])for(const f in x){const v=x[f];if(v&&typeof v==='object'&&v.id===id)return v.name||id}return id}
async function fileURL(id){if(URLS[id])return URLS[id];const r=await fileRec(id);if(!r)return null;URLS[id]=URL.createObjectURL(r.blob);return URLS[id]}
function fileIds(){const ids=new Set();for(const k in db)if(Array.isArray(db[k]))for(const x of db[k])for(const f in x){const v=x[f];if(v&&typeof v==='object'&&typeof v.id==='string'&&v.id.startsWith('f_'))ids.add(v.id)}return [...ids]}

async function boot(){
 await local.open();
 let tk=takeToken();if(!tk&&HELPER())tk=await takeCode();if(!G.token)loadToken();if(!tokenOk())await renew();
 const st=await local.get('kv','state');
 if(st&&st.db){db=st.db;G.base=st.base||null;G.fileId=st.fileId||null;G.version=st.version||null;G.rev=st.rev||0;G.syncedRev=st.syncedRev||0;G.pendingFiles=st.pendingFiles||[]}
 if(!db&&tokenOk()){ // first open on a new device: look for her planner in Drive before making a new one
  try{setStatus('Looking for your planner…');const f=await findFile(DATA);
   if(f){db=await (await api(`${DRIVE}/files/${f.id}?alt=media`)).json();G.fileId=f.id;G.version=f.version;G.base=clone(db)}}catch(e){}}
 const fresh=!db;
 if(!db)db=seed();
 ensure();await persist();
 if(tk==='interaction_required'||tk==='login_required'||tk==='consent_required')setStatus('Tap to reconnect');
 else if(tk&&tk!=='ok')setStatus('Sign-in did not finish');
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
 window.addEventListener('online',()=>sync());
 setInterval(()=>{if(document.visibilityState==='visible'){if(G.remoteWaiting&&!busy())refreshView();sync()}},60000);
 setInterval(()=>{if(G.remoteWaiting&&!busy())refreshView()},3000);

/* automatic backups: a full copy of the planner saved to her Drive every 14 days, newest 6 kept (about 3 months) */
const BK={busy:false,list:null,keep:6,every:14};
const bkName=()=>`sadhana-backup-${today()}.json`;
async function listBackups(){const q=encodeURIComponent("name contains 'sadhana-backup-' and trashed=false");
 const j=await (await api(`${DRIVE}/files?spaces=appDataFolder&q=${q}&orderBy=createdTime desc&fields=files(id,name,createdTime,size)&pageSize=100`)).json();
 return (j.files||[]).sort((a,b)=>(a.createdTime||a.name)<(b.createdTime||b.name)?1:-1)}
async function makeBackup(){await createFile(bkName(),JSON.stringify({app:'sadhana',at:new Date().toISOString(),db}),'application/json');
 db.lastBackup=today();G.rev++;await persist();
 try{const all=await listBackups();for(const f of all.slice(BK.keep)){try{await api(`${DRIVE}/files/${f.id}`,{method:'DELETE'})}catch(e){}}BK.list=all.slice(0,BK.keep)}catch(e){}

 BK.busy=true;try{await makeBackup()}catch(e){console.warn('Backup failed',e)}BK.busy=false}
function backupNote(){const last=db.lastBackup;
 if(!configured()||!(tokenOk()||ls.get('sadhana.signedIn')))return 'Sign in with Google to turn on automatic backups.';
 return `A full copy of your planner is saved to your Google Drive every two weeks, and the last ${BK.keep} are kept. ${last?`Last backup: <b>${fFull(last)}</b>. Next: around ${fFull(addDays(last,BK.every))}.`:'The first one will be made shortly.'}`}
async function restoreBackup(id){const r=await (await api(`${DRIVE}/files/${id}?alt=media`)).json();if(!r||!r.db)throw new Error('bad');
 const keepFiles={...(db.driveFiles||{}),...(r.db.driveFiles||{})};db=r.db;db.driveFiles=keepFiles;ensure();save();applyTheme();render()}
function bkLabel(f){const t=f.createdTime&&!isNaN(Date.parse(f.createdTime))?new Date(f.createdTime):null;const d=(f.name.match(/\d{4}-\d{2}-\d{2}/)||[''])[0];
 return t?`${fFull(iso(t))}, ${pad(t.getHours())}:${pad(t.getMinutes())}`:(d?fFull(d):esc(f.name))}

/* ---------- Google Calendar: a "Sadhana" calendar she can see in Apple Calendar, plus her own events shown here ----------
   - Writes: events, birthdays (yearly), seva due dates, trips and planned dates go into one calendar called "Sadhana".
     Each item always gets the same event id, so two devices never create duplicates, and removed items are deleted.
   - Reads: events from the Google calendars she picks, shown on Home, the day plan and the month calendar.
   - Permissions are only requested once she taps "Connect Google Calendar" in Settings. */
const CAL='https://www.googleapis.com/calendar/v3';
const calGranted=()=>tokenOk()&&(G.scopes||'').includes('calendar.app.created');
const calCanRead=()=>tokenOk()&&(G.scopes||'').includes('calendar.events.readonly')&&(G.scopes||'').includes('calendar.calendarlist.readonly');
const C={calId:null,list:null,busy:false,again:false,timer:null,last:0,ext:{},extAt:{},loading:{},error:null,pushed:0};
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/London'}catch(e){return 'Europe/London'}})();
const calDefaults=()=>({hearings:true,events:true,birthdays:true,seva:true,trips:true,dates:true,schedule:true,tasks:true,nonneg:true,hindu:true});
const calAlerts=()=>({hearing:'1440,60',tasks:'off',timed:'10',bday:'day',allday:'eve',...(db.settings.gcalAlerts||{})});
const calWhat=()=>({...calDefaults(),...(db.settings.gcalWhat||{})});
const hexId=s=>'sd'+Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
const strHash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const dayAfter=d=>addDays(d,1);
async function calApi(path,opt={}){const body=opt.json!==undefined?JSON.stringify(opt.json):undefined;
 const r=await api(CAL+path,{method:opt.method||'GET',headers:body?{'Content-Type':'application/json'}:{},body});
 return r.status===204?null:r.json()}

function wanted(){const w=calWhat(),out={};const tz=TZ;const cm=catMap();
 const allDay=(start,end,summary,extra={})=>({summary,start:{date:start},end:{date:end||dayAfter(start)},transparency:'transparent',...extra});
 if(w.events)for(const e of db.events||[]){if(!e.date||!e.title)continue;
  let body;if(e.time&&/^\d{1,2}:\d{2}$/.test(e.time)){const [h,m]=e.time.split(':').map(Number);const st=`${e.date}T${pad(h)}:${pad(m)}:00`;const en=new Date(parse(e.date).getTime()+((h*60+m+60)*60000));
   body={summary:e.title,start:{dateTime:st,timeZone:tz},end:{dateTime:`${iso(en)}T${pad(en.getHours())}:${pad(en.getMinutes())}:00`,timeZone:tz}}}
  else body=allDay(e.date,null,e.title);
  if(e.location)body.location=e.location;if(e.notes)body.description=e.notes;body._cat=e.category;out['ev:'+e.id]=body}
 if(w.birthdays)for(const b of db.birthdays||[]){if(!b.date||!b.name)continue;out['bd:'+b.id]=allDay(b.date,null,`🎂 ${b.name}'s birthday`,{recurrence:['RRULE:FREQ=YEARLY'],description:b.gift?`Gift ideas: ${b.gift}`:'',_cat:cm.birthdays})}
 if(w.seva)for(const s of db.seva||[]){if(!s.due||s.done||!s.title)continue;out['sv:'+s.id]=allDay(s.due,null,`🪷 ${s.kind==='Call'?'Seva call':'Seva'}: ${s.title}`,{description:[s.person,s.phone,s.notes].filter(Boolean).join('\n'),_cat:cm.seva})}
 if(w.trips)for(const t of db.trips||[]){if(!t.start||!t.destination)continue;out['tr:'+t.id]=allDay(t.start,dayAfter(t.end&&t.end>=t.start?t.end:t.start),`✈️ ${t.destination}`,{description:t.stay||'',_cat:cm.trips})}
 if(w.dates)for(const d of db.dates||[]){if(!d.date||!d.idea||d.status==='Idea')continue;out['dt:'+d.id]=allDay(d.date,null,`💛 ${d.idea}`,{description:d.notes||'',_cat:cm.dates})}
 if(w.schedule){const from=addDays(today(),-14);const mins=k=>(+k.slice(0,2))*60+(+k.slice(3));const hm=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`;
  for(const d in db.days||{}){if(d<from)continue;const sc=(db.days[d]||{}).schedule||{};
   const ks=Object.keys(sc).filter(k=>/^\d{2}:\d{2}$/.test(k)&&(sc[k]||'').trim()).sort();
   ks.forEach((k,i)=>{const st=mins(k),nx=i+1<ks.length?mins(ks[i+1]):Infinity;const len=+(((db.days[d]||{}).dur||{})[k])||0;const en=Math.min(len?st+len:Math.min(st+(k.endsWith(':30')?30:60),nx),23*60+59);
    out['sc:'+d+':'+k.replace(':','')]={summary:sc[k].trim(),start:{dateTime:`${d}T${k}:00`,timeZone:tz},end:{dateTime:`${d}T${hm(en)}:00`,timeZone:tz},description:'From your Sadhana day plan',_cat:(((db.days[d]||{}).cat)||{})[k]}})}}
 if(w.hearings)for(const h of db.hearings||[]){if(!h.date||h.status==='Vacated'||h.status==='Adjourned')continue;const m=(db.matters||[]).find(x=>x.id===h.matter)||{};const nm=m.name||'Hearing';
  const desc=[h.type,[h.court,h.room].filter(Boolean).join(', '),h.judge?'Judge: '+h.judge:'',m.solicitor?'Instructed by '+m.solicitor:'',h.notes].filter(Boolean).join('\n');
  let body;if(h.until&&h.until>h.date)body=allDay(h.date,dayAfter(h.until),`⚖️ ${h.type||'Hearing'}: ${nm}`,{description:desc});
  else if(h.time&&/^\d{1,2}:\d{2}$/.test(h.time)){const [hh,mm]=h.time.split(':').map(Number);const len={'2 hours':120,'Half day':180,'Full day':360}[h.length]||60;const st=hh*60+mm,en=Math.min(st+len,23*60+59);
   body={summary:`⚖️ ${nm}${h.type?' ('+h.type+')':''}`,start:{dateTime:`${h.date}T${pad(hh)}:${pad(mm)}:00`,timeZone:tz},end:{dateTime:`${h.date}T${pad(Math.floor(en/60))}:${pad(en%60)}:00`,timeZone:tz},description:desc}}
  else body=allDay(h.date,null,`⚖️ ${nm}${h.type?' ('+h.type+')':''}`,{description:desc});
  if(h.court)body.location=[h.court,h.room].filter(Boolean).join(', ');body.hearing=1;body._cat=cm.hearings;out['hr:'+h.id]=body;
  if(h.status==='Done')continue;
  if(h.papersDue)out['hp:'+h.id]=allDay(h.papersDue,null,`📚 Papers due: ${nm}`,{_cat:cm.hearings});
  if(h.skeletonDue)out['hs:'+h.id]=allDay(h.skeletonDue,null,`✍️ Skeleton due: ${nm}`,{_cat:cm.hearings})}
 if(w.tasks){const td=today();for(const t of db.todos||[]){if(t.done||!t.title)continue;const when=t.planned||t.due;if(!when)continue;
  const day=when<td?td:when;const extra=[t.priority&&t.priority!=='Normal'?t.priority:'',t.due&&t.due!==day?`due ${fShort(t.due)}`:'',when<td?`from ${fShort(when)}`:''].filter(Boolean).join(', ');
  const proj=t.project?((db.projects||[]).find(p=>p.id===t.project)||{}).name:'';
  out['td:'+t.id]=allDay(day,null,`${t.priority==='Non-negotiable'?'⭐':'☐'} ${t.title}${extra?' ('+extra+')':''}`,{description:[proj?'Project: '+proj:'',t.notes||'','Tick it off in Sadhana and it will disappear from here.'].filter(Boolean).join('\n'),_cat:t.category,task:1})}}
 if(w.hindu&&typeof HINDU!=='undefined'){const from=addDays(today(),-7);for(const d in HINDU){if(d<from)continue;const x=hinduOn(d);if(!x||!(x.ek||x.major))continue;
  out['hi:'+d]=allDay(d,null,`${x.ek?'🌙':'🪔'} ${(x.o||'Ekadashi').split('; ')[0]}${x.ek?(x.nir?' (nirjala fast)':' (fast)'):''}`,{description:[x.h+' · Vikram Samvat '+vsYear(d),x.o].filter(Boolean).join('\n')+'\nFrom the BAPS calendar.',_cat:cm.hindu})}}
 if(w.nonneg){const from=addDays(today(),-7);const taken=new Set(Object.values(out).filter(b=>b.task).map(b=>b.start.date+'|'+b.summary.replace(/^\S+ /,'').replace(/ \(.*\)$/,'').trim().toLowerCase()));
  for(const d in db.days||{}){if(d<from)continue;(db.days[d].nonneg||[]).forEach((q,i)=>{const t=(q&&q.t||'').trim();if(!t||q.done||taken.has(d+'|'+t.toLowerCase()))return;
   out['nn:'+d+':'+i]=allDay(d,null,`⭐ ${t}`,{description:'One of your three non-negotiables for today. Tick it off in Sadhana and it will disappear from here.',task:1})})}}
 const al=calAlerts();
 const where={};
 for(const k in out){const b=out[k];where[k]=catCals()?validCat(b._cat):'';delete b._cat;let mins=[];
  if(b.task){delete b.task;mins=al.tasks==='morn'?[900]:al.tasks==='eve'?[360]:[]}
  else if(b.hearing){delete b.hearing;mins=String(al.hearing).split(',').map(Number).filter(Boolean)}
  else if(b.start.dateTime){if(+al.timed)mins=[+al.timed]}
  else if(k.startsWith('bd:')){mins=al.bday==='week'?[10980,900]:al.bday==='day'?[900]:[]}
  else mins=al.allday==='eve'?[360]:al.allday==='morn'?[900]:al.allday==='two'?[2340]:[];
  b.reminders={useDefault:false,overrides:mins.map(m=>({method:'popup',minutes:m}))};
  b.status='confirmed';const h=strHash(JSON.stringify(b));b.extendedProperties={private:{sadhana:'1',h}}}
 wanted.where=where;return out}

const CAL_TAG='Planner events from Sadhana';
const catTag=id=>`${CAL_TAG} [${id}]`;
async function ourCals(){const out={main:null,byCat:{},stray:[]};let page=null;
 do{const j=await calApi('/users/me/calendarList?minAccessRole=owner&maxResults=250'+(page?'&pageToken='+page:''));
  for(const c of j.items||[]){const d=c.description||'';if(d===CAL_TAG&&c.summary==='Sadhana'){if(!out.main)out.main=c}else if(d.startsWith(CAL_TAG+' [')){const id=d.slice(CAL_TAG.length+2,-1);if(!out.byCat[id])out.byCat[id]=c;else out.stray.push(c)}}
  page=j.nextPageToken}while(page);return out}
async function findOrMakeCal(){if(C.calId)return C.calId;const o=await ourCals();
 const main=o.main||await calApi('/calendars',{method:'POST',json:{summary:'Sadhana',description:CAL_TAG,timeZone:TZ}});C.calId=main.id;return C.calId}
async function catCal(id,have){const c=catById(id);const want=`Sadhana · ${c.name}`;
 if(have[id]){if(have[id].summary!==want){try{await calApi(`/calendars/${encodeURIComponent(have[id].id)}`,{method:'PATCH',json:{summary:want}})}catch(e){}}return have[id].id}
 const made=await calApi('/calendars',{method:'POST',json:{summary:want,description:catTag(id),timeZone:TZ}});return made.id}

async function pushCalendar(){
 const want=wanted(),where=wanted.where;const o=await ourCals();
 if(!o.main)o.main=await calApi('/calendars',{method:'POST',json:{summary:'Sadhana',description:CAL_TAG,timeZone:TZ}});C.calId=o.main.id;
 const target={'':o.main.id};for(const k in want){const c=where[k];if(c&&!(c in target))target[c]=await catCal(c,o.byCat)}
 C.catCalIds={...Object.fromEntries(Object.entries(o.byCat).map(([k,v])=>[k,v.id])),...target};
 const all=new Set([o.main.id,...Object.values(o.byCat).map(c=>c.id),...Object.values(target)]);
 let n=0;
 for(const cal of all){const have={};let page=null;
  do{const j=await calApi(`/calendars/${encodeURIComponent(cal)}/events?maxResults=2500&showDeleted=false&fields=items(id,extendedProperties),nextPageToken`+(page?'&pageToken='+page:''));for(const ev of j.items||[]){const pr=(ev.extendedProperties||{}).private||{};if(pr.sadhana==='1')have[ev.id]=pr.h||''}page=j.nextPageToken}while(page);
  const base=`/calendars/${encodeURIComponent(cal)}/events`;const mine=Object.keys(want).filter(k=>target[where[k]||'']===cal);const ids=new Set(mine.map(hexId));
  for(const k of mine){const id=hexId(k),body={...want[k],id};
   if(!(id in have)){try{await calApi(base,{method:'POST',json:body})}catch(e){if(e.code==='http'&&e.status===409)await calApi(`${base}/${id}`,{method:'PUT',json:body});else throw e}n++}
   else if(have[id]!==body.extendedProperties.private.h){await calApi(`${base}/${id}`,{method:'PUT',json:body});n++}}
  for(const id in have){if(!ids.has(id)){try{await calApi(`${base}/${id}`,{method:'DELETE'})}catch(e){if(!(e.code==='http'&&(e.status===404||e.status===410)))throw e}n++}}}
 /* a category she deleted: remove its calendar once it's empty */
 for(const [id,c] of Object.entries(o.byCat)){if(!catById(id)||!catCals()){if(!Object.values(target).includes(c.id)){try{await calApi(`/calendars/${encodeURIComponent(c.id)}`,{method:'DELETE'})}catch(e){}}}}
 C.pushed=n;return n}

/* her own calendars */
async function calList(){if(C.list)return C.list;const j=await calApi('/users/me/calendarList?maxResults=250');C.list=(j.items||[]).filter(c=>!(c.description||'').startsWith(CAL_TAG)).map(c=>({id:c.id,name:c.summaryOverride||c.summary,primary:!!c.primary,color:c.backgroundColor}));return C.list}
const showCals=()=>db.settings.gcalShow||['primary'];
async function loadMonth(ym){
 if(!calCanRead()||C.loading[ym])return;if(C.extAt[ym]&&Date.now()-C.extAt[ym]<60000)return;
 C.loading[ym]=true;
 try{const lst=await calList();const ids=showCals().map(id=>id==='primary'?(lst.find(c=>c.primary)||{}).id||'primary':id);
  const tMin=new Date(parse(ym+'-01').getTime()-86400000).toISOString(),tMax=new Date(parse(addMonths(ym,1)+'-01').getTime()+86400000).toISOString();
  const out=[];
  const ownMeta={};if(calGranted()){try{const o=await ourCals();if(o.main){ids.push(o.main.id);ownMeta[o.main.id]={name:'Sadhana',color:'',cat:''}}for(const [cid,c] of Object.entries(o.byCat)){ids.push(c.id);ownMeta[c.id]={name:c.summary,color:'',cat:cid}}}catch(e){}}
  for(const id of [...new Set(ids)]){const meta=ownMeta[id]||(lst.find(c=>c.id===id)||{name:'Calendar'});
   const j=await calApi(`/calendars/${encodeURIComponent(id)}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&fields=items(summary,start,end,location,status,extendedProperties)`);
   for(const ev of j.items||[]){if(ev.status==='cancelled')continue;if((((ev.extendedProperties||{}).private)||{}).sadhana==='1')continue;
    if(ev.start.date){let d=ev.start.date;while(d<ev.end.date){out.push({date:d,title:ev.summary||'(busy)',time:'',cal:meta.name,color:meta.color,cat:meta.cat||''});d=addDays(d,1)}}
    else{const s=new Date(ev.start.dateTime),en=new Date(ev.end.dateTime||ev.start.dateTime);out.push({date:iso(s),time:`${pad(s.getHours())}:${pad(s.getMinutes())}`,end:iso(en)===iso(s)?`${pad(en.getHours())}:${pad(en.getMinutes())}`:'24:00',title:ev.summary||'(busy)',cal:meta.name,color:meta.color,cat:meta.cat||'',loc:ev.location||''})}}}
  C.ext[ym]=out;C.extAt[ym]=Date.now();C.error=null}
 catch(e){C.error=e.code==='scope'?'scope':'load';C.extAt[ym]=Date.now()}
 C.loading[ym]=false;refreshView()}
function extOn(d){const ym=d.slice(0,7);if(!calCanRead()||!db.settings.gcal)return [];if(!C.loading[ym]&&!(C.extAt[ym]&&Date.now()-C.extAt[ym]<120000))setTimeout(()=>loadMonth(ym),0);return (C.ext[ym]||[]).filter(e=>e.date===d).sort((a,b)=>(a.time||'00')<(b.time||'00')?-1:1)}

/* scheduling */
function calSoon(){if(!db.settings.gcal||!calGranted())return;clearTimeout(C.timer);C.timer=setTimeout(runCal,Date.now()-C.last<20000?20000:1500)}
async function runCal(){if(C.busy){C.again=true;return}if(!db.settings.gcal||!calGranted())return;
 C.busy=true;C.last=Date.now();
 try{await pushCalendar();C.error=null;C.okAt=new Date();for(const k in C.extAt)C.extAt[k]=0}
 catch(e){C.error=e.code==='scope'?'scope':e.code==='api_off'?'api_off':'push';console.warn('Calendar sync failed',e)}
 C.busy=false;if(C.again){C.again=false;calSoon()}
 const n=document.getElementById('calnote');if(n)n.innerHTML=calNote()}
function calNote(){

 if(C.error==='push')return 'The last calendar update did not finish. It will try again; you can also tap <b>Sync calendar now</b>.';
 const when=C.okAt?` Last updated from this device at ${pad(C.okAt.getHours())}:${pad(C.okAt.getMinutes())}.`:'';
 return 'Connected on this device. Your planner dates go into the <b>Sadhana</b> calendar in Google Calendar'+(calCanRead()?', and events from the calendars ticked below show up here.':'.')+when}

/* ---------- calendar categories ----------
   Her own list of categories, each with a colour. Events, to-dos and day plan slots can have one;
   built-in items (hearings, seva, birthdays, trips, date nights) follow the mapping in Settings.
   In Google/Apple Calendar each category gets its own calendar ("Sadhana · Work"), so she can colour and hide them there. */
const CAT_COLOURS=[['#6E7E5C','Sage'],['#4B5840','Olive'],['#A07A57','Clay'],['#C9A27C','Sand'],['#A8614A','Terracotta'],['#B77A8A','Rose'],['#8C7BB0','Lavender'],['#5E8A9A','Teal'],['#D08C3C','Saffron'],['#6B6052','Walnut']];
const DEFAULT_CATS=[{id:'c_work',name:'Work',color:'#4B5840'},{id:'c_personal',name:'Personal',color:'#C9A27C'},{id:'c_satsang',name:'Satsang',color:'#D08C3C'},{id:'c_health',name:'Health',color:'#5E8A9A'},{id:'c_social',name:'Social',color:'#B77A8A'},{id:'c_family',name:'Family',color:'#8C7BB0'}];
function cats(){if(!db.catInit){db.categories=DEFAULT_CATS.map(c=>({...c}));db.catInit=true}return db.categories||(db.categories=[])}
const catById=id=>id?cats().find(c=>c.id===id):null;
const validCat=id=>catById(id)?id:'';
const catColor=id=>(catById(id)||{}).color||'';
const catMap=()=>({hindu:'c_satsang',hearings:'c_work',seva:'c_satsang',birthdays:'c_family',trips:'c_personal',dates:'c_social',...(db.settings.catMap||{})});
const catCals=()=>db.settings.catCals!==false;
const onlyCats=()=>new Set((db.settings.catOnly||[]).filter(id=>id==='none'||catById(id)));
const catShown=id=>{const o=onlyCats();return !o.size||o.has(validCat(id)||'none')};
const evStyle=id=>{const c=catColor(validCat(id));return c?` style="background:color-mix(in srgb, ${c} 18%, transparent);color:inherit;box-shadow:inset 3px 0 0 ${c}"`:''};
const rowStyle=id=>{const c=catColor(validCat(id));return c?` style="box-shadow:inset 3px 0 0 ${c};padding-left:8px"`:''};
function catOpts(sel,blank){return `<option value="">${blank}</option>`+cats().map(c=>`<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}
function catFilterBar(){const o=onlyCats();if(!cats().length)return '';
 const chip=(id,label,col)=>`<button class="chip catchip ${o.has(id)?'on':''}" data-act="catPick" data-id="${esc(id)}" aria-pressed="${o.has(id)}">${col?`<i class="catdot" style="background:${esc(col)}"></i>`:''}${label}</button>`;
 return `<div class="row catbar" style="gap:6px;flex-wrap:wrap;margin:4px 0 12px"><button class="chip catchip ${o.size?'':'on'}" data-act="catPick" data-id="" aria-pressed="${!o.size}">All</button>${cats().map(c=>chip(c.id,esc(c.name),c.color)).join('')}${chip('none','No category','')}</div>${o.size?`<p class="small muted" style="margin:-4px 0 10px">Showing ${[...o].map(id=>id==='none'?'items with no category':esc((catById(id)||{}).name||'')).join(', ')}. Tap <b>All</b> to see everything.</p>`:''}`}

/* ---------- time tracking timer ----------
   Stored in the planner itself (db.timer), so she can start it on her iPhone and stop it on her Mac.
   It records start times rather than counting, so it keeps going while the app is closed. */
const TM=()=>(typeof db!=="undefined"&&db&&db.timer)||null;
function tmElapsed(t){if(!t)return 0;const end=t.stopAt||t.pausedAt||Date.now();return Math.max(0,end-t.start-(t.paused||0))}
function tmFmt(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return `${h}:${pad(m)}:${pad(x)}`}
const tmHours=ms=>Math.max(0.1,Math.ceil(ms/360000)/10); /* 6-minute units, rounded up */
function tmState(t){return !t?'idle':t.stopAt?'stopped':t.pausedAt?'paused':'running'}
function timerCard(compact){const t=TM(),st=tmState(t);
 const matters=db.matters||[];
 const msel=`<select class="field" id="tm_matter" data-newref="matters" ${st==="idle"?"":`data-bind="timer.matter"`} aria-label="Matter" style="min-width:0;flex:1 1 200px">${'<option value="">Choose a matter (optional)</option>'+matters.map(m=>`<option value="${m.id}" ${t&&t.matter===m.id?'selected':''}>${esc(m.name)}</option>`).join('')+quickOpt('matters')}</select>`;
 if(st==='idle')return `<section class="card timer idle"><div class="row" style="gap:10px;flex-wrap:wrap;align-items:center"><span class="tmicon">⏱</span><b style="font-family:var(--serif);font-weight:500;font-size:1.05rem">Time tracker</b>${msel}<button class="btn primary" data-act="tmStart">Start timer</button></div></section>`;
 const ms=tmElapsed(t);
 return `<section class="card timer ${st}"><div class="row" style="gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between">
  <div class="row" style="gap:12px;align-items:baseline"><span class="tmicon">⏱</span><span class="tmclock num" id="tmclock">${tmFmt(ms)}</span><span class="small muted">${st==='running'?'Running since '+new Date(t.start).toTimeString().slice(0,5):st==='paused'?'Paused':'Stopped: '+tmHours(ms).toFixed(1)+' hrs to log'}</span></div>
  <div class="row" style="gap:8px;flex-wrap:wrap">${st==='running'?`<button class="btn" data-act="tmPause">Pause</button>`:st==='paused'?`<button class="btn" data-act="tmResume">Resume</button>`:`<button class="btn" data-act="tmResume">Keep going</button>`}<button class="btn primary" data-act="tmStop">${st==='stopped'?'Log it':'Stop and log'}</button><button class="btn ghost" data-act="tmDiscard">Discard</button></div></div>
  <div class="row" style="gap:10px;flex-wrap:wrap;margin-top:12px">${msel}<input class="field" id="tm_note" data-bind="timer.note" value="${esc(t.note||'')}" placeholder="What are you working on?" style="flex:2 1 260px;min-width:0"></div></section>`}
function tmPill(){const t=TM(),st=tmState(t);return st==='idle'?'':`<button class="tmpill ${st}" data-act="tmGo">⏱ <span id="tmpill">${tmFmt(tmElapsed(t))}</span></button>`}
function tmTick(){const t=TM();if(!t)return;const v=tmFmt(tmElapsed(t));for(const id of ['tmclock','tmpill']){const el=document.getElementById(id);if(el)el.textContent=v}}
setInterval(tmTick,1000);
function tmLog(){const t=TM();if(!t)return;if(!t.stopAt){if(t.pausedAt){t.stopAt=t.pausedAt}else t.stopAt=Date.now()}save();
 const ms=tmElapsed(t),d=iso(new Date(t.start));
 openForm('work',null,{date:d,matter:t.matter||'',work:t.note||'',basis:'Hourly',hours:tmHours(ms),rate:db.settings.rate,status:'Unbilled'});MODAL.fromTimer=true}

/* ---------- add a matter (or project) right where you're choosing one ---------- */
const QUICK={matters:{label:'+ Add a new matter…',name:'Matter or case name',extra:'Instructing solicitor (optional)',make:(n,x)=>({id:'m_'+uid(),name:n,solicitor:x})},
 projects:{label:'+ Add a new project…',name:'Project name',extra:'',make:n=>({id:'p_'+uid(),name:n,status:'In progress'})}};
const quickOpt=ref=>QUICK[ref]?`<option value="__new">${QUICK[ref].label}</option>`:'';
function quickAdd(sel){const ref=sel.dataset.newref,q=QUICK[ref];if(!q)return;const prev=sel.dataset.prev||'';
 const box=document.createElement('div');box.className='quickadd';
 box.innerHTML=`<input class="field qa-name" placeholder="${q.name}" aria-label="${q.name}">${q.extra?`<input class="field qa-extra" placeholder="${q.extra}" aria-label="${q.extra}">`:''}<div class="row" style="gap:8px"><button type="button" class="btn sm primary qa-add">Add</button><button type="button" class="btn sm ghost qa-cancel">Cancel</button></div>`;
 sel.insertAdjacentElement('afterend',box);sel.style.display='none';const nm=box.querySelector('.qa-name');nm.focus();
 const done=id=>{box.remove();sel.style.display='';sel.value=id||prev;sel.dataset.prev=sel.value;if(sel.dataset.bind){setPath(sel.dataset.bind,sel.value);save()}};
 const add=()=>{const n=nm.value.trim();if(!n){nm.focus();return}const x=(box.querySelector('.qa-extra')||{}).value||'';const item=q.make(n,x.trim());db[ref].push(item);save();
  for(const other of document.querySelectorAll(`select[data-newref="${ref}"]`)){const o=document.createElement('option');o.value=item.id;o.textContent=n;other.insertBefore(o,other.querySelector('option[value="__new"]'))}
  done(item.id);toast(`${n} added`)};
 box.querySelector('.qa-add').addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();add()});
 box.querySelector('.qa-cancel').addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();done('')});
 box.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();add()}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();done('')}})}
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.dataset&&t.dataset.newref)t.dataset.prev=t.value});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.newref&&t.value==='__new'){ev.stopImmediatePropagation();quickAdd(t)}},true);

function sSeva(){const f=S.f.seva;const t=today();let items=db.seva.slice();if(f==='Open')items=items.filter(s=>!s.done);else if(f==='Calls')items=items.filter(s=>s.kind==='Call'&&!s.done);else if(f==='Actions')items=items.filter(s=>s.kind==='Action'&&!s.done);else if(f==='Done')items=items.filter(s=>s.done);

function sNotes(){const tg=S.f.ntag;const items=db.satnotes.filter(n=>!tg||(n.tags||[]).includes(tg)).sort((a,b)=>(a.date||'')<(b.date||'')?1:-1);

/* ---------- modal form ---------- */
function fieldHtml(f,v){const id='f_'+f.k,cls=`${f.full||f.t==='textarea'?'full':''}`;const lab=`${esc(f.l)}${f.req?' *':''}`;
 if(f.t==='check')return `<label class="cb ${cls||'full'}"><input type="checkbox" class="check" id="${id}" ${v?'checked':''}>${esc(f.l)}</label>`;
 let inp;
 if(f.t==='textarea')inp=`<textarea class="field" id="${id}" style="${f.big?'min-height:220px':''}">${esc(v)}</textarea>`;
 else if(f.t==='select'){const o=typeof f.o==='function'?f.o():f.o;inp=`<select class="field" id="${id}"><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
 else if(f.t==='ref')inp=`<select class="field" id="${id}" ${QUICK[f.ref]?`data-newref="${f.ref}"`:''}><option value=""></option>${db[f.ref].map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x[f.show])}</option>`).join('')}${quickOpt(f.ref)}</select>`;
 else if(f.t==='rating')inp=`<select class="field" id="${id}"><option value=""></option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${+v===n?'selected':''}>${'★'.repeat(n)} ${n}</option>`).join('')}</select>`;
 else if(f.t==='tags')inp=`<input class="field" id="${id}" value="${esc((v||[]).join(', '))}" placeholder="e.g. bhakti, seva, katha">`;
 else if(f.t==='file'||f.t==='image')inp=`<input class="field" type="file" id="${id}" ${f.t==='image'?'accept="image/*"':'accept="application/pdf,image/*,.doc,.docx"'}>${v?`<span class="small">Current: ${esc(v.name)} <button type="button" class="btn sm" data-act="viewFile" data-f="${v.id}">View</button> <button type="button" class="btn sm ghost" data-act="clearFile" data-k="${f.k}">Remove</button></span>`:''}`;
 else inp=`<input class="field" id="${id}" type="${f.t==='money'?'number':f.t}" ${f.t==='money'?'step="0.01"':''} ${f.step?`step="${f.step}"`:''} value="${esc(v??'')}">`;
 return `<label class="${cls}">${lab}${inp}</label>`}
let MODAL=null;
function openForm(col,id,preset){const sc=SCHEMA[col];const item=id?byId(col,id):{...(preset||{})};MODAL={col,id,clear:{}};
 document.getElementById('modalroot').innerHTML=`<div class="scrim" data-act="closeModal"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${id?'Edit':'New'} ${sc.name}"><header><h2>${id?'Edit':'New'} ${sc.name}</h2>${item.ex?'<p class="small" style="color:var(--clay);margin-top:4px">Example entry</p>':''}</header><div class="body">${sc.f.map(f=>fieldHtml(f,item[f.k])).join('')}</div><p class="small" id="ferr" style="color:var(--rust);padding:0 24px" hidden></p><footer>${id?`<button type="button" class="btn danger del" data-act="delItem">Delete</button>`:''}<button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="submit" class="btn primary">Save</button></footer></form></div>`;
 if(col==='meals'){const t=document.getElementById('f_ingredients');if(t){const b=document.createElement('button');b.type='button';b.className='btn sm';b.style.marginTop='8px';b.dataset.act='shopForm';b.innerHTML=ic('cart')+'Add these to my shopping list';t.insertAdjacentElement('afterend',b)}}
 setTimeout(()=>{const f=document.querySelector('#mform input:not([type=file]),#mform textarea');if(f)f.focus()},30)}
function closeModal(){document.getElementById('modalroot').innerHTML='';MODAL=null}
async function submitForm(){const {col,id}=MODAL;const sc=SCHEMA[col];const out={};
 for(const f of sc.f){const el=document.getElementById('f_'+f.k);if(!el)continue;let v;
  if(f.t==='check')v=el.checked;else if(f.t==='number'||f.t==='money'||f.t==='rating')v=el.value===''?'':Number(el.value);
  else if(f.t==='tags')v=el.value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
  else if(f.t==='file'||f.t==='image'){if(el.files&&el.files[0])v=await putFile(el.files[0]);else if(MODAL.clear[f.k])v=null;else continue}
  else v=el.value.trim();
  if(f.req&&(v===''||v==null)){const e=document.getElementById('ferr');e.textContent=`Add ${f.l.toLowerCase().replace(' *','')} to save.`;e.hidden=false;el.focus();return}
  out[f.k]=v}
 if(col==='fees'&&out.status==='Paid'&&!out.paid)out.paid=out.amount;
 if(col==='fees'&&(out.status==='Paid')){const ex=id?byId(col,id):null;out.paidOn=(ex&&ex.paidOn)||today()}
 if(id){const it=byId(col,id);Object.assign(it,out)}else db[col].push({id:uid(),...out});
 if(col==='fees'&&out.status==='Paid'){db.work.filter(w=>w.feeNote&&w.feeNote===out.number).forEach(w=>w.status='Paid')}
 if(col==='fees'&&!id){db.work.filter(w=>w.feeNote&&w.feeNote===out.number&&w.status==='Unbilled').forEach(w=>w.status='Invoiced')}
 if(MODAL&&MODAL.fromTimer&&col==='work')db.timer=null;save();closeModal();render();toast(id?'Saved':'Added')}
